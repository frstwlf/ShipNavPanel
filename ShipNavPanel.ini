; ===========================================================================
;  Cruise Navigation Panel 1.1
;  (the plugin, its ini and its log are all named ShipNavPanel)
; ===========================================================================
;  In cruise mode, your ship scanner key opens a panel listing every body in
;  the system: planets, moons nested under them, stations and points of
;  interest, wearing the game's own map icons. The mouse wheel - or the D-pad
;  on a controller - moves the highlight, the confirm key locks a body, and the
;  game's own HUD marker points at it as you steer. Close the panel without
;  confirming and nothing changes, which is also how you clear a target without
;  picking another one. Outside cruise the mod is idle and the scanner key
;  keeps its normal job.
;
;  HOW TO CHANGE A SETTING
;    Make a file called ShipNavPanelCustom.ini next to this one and put only
;    the lines you want to change in it, under the same [Section] heading.
;    Your file wins, and it survives an update of the mod. For example:
;
;        [Panel]
;        fPanelOffsetX=-540.0
;        uPanelMaxRows=8
;
;    Settings are read once when the game starts, so restart to see a change.
;
;  Colours are written as 0xRRGGBB. Plain decimal works too if you prefer it.
;  Keep comments on their own line: a comment after a value on the same line
;  is read as part of the value, and the setting quietly falls back to its
;  default.
;
;  If something misbehaves, see the [Recon] section at the bottom: one switch
;  there turns on the detail worth putting in a bug report. The log lives in
;  Documents\My Games\Starfield\SFSE\Logs\ShipNavPanel.log.
; ===========================================================================

[Panel]

; ---------------------------------------------------------------------------
; START HERE - size, position, and the controls
; ---------------------------------------------------------------------------

; Where the panel sits, measured from the centre of the screen, and how big it
; is. Negative X is left of centre, negative Y is above it. The width matches
; the ship HUD's own loot panel. Long names truncate with the game's own "..."
; when they reach the distance column, and a slim scrollbar appears down the
; left edge when the system holds more bodies than the panel has rows.
fPanelOffsetX=-780.0
fPanelOffsetY=-180.0
fPanelWidth=425.0
fPanelRowHeight=26.0
uPanelMaxRows=10

; The key that locks the highlighted body, or clears it if it is already
; locked. A comma-separated list, and any entry fires it. An entry is either a
; user-event NAME, which follows your bindings wherever you have put them, or
; "#<id>", a raw key code for a key the game has no name for.
;
; The default is your POV toggle. While the panel is open the mod hides that
; key from the camera, the same way it hides the mouse wheel, so it locks a
; body without also swinging your view.
;
; IF A KEY DOES NOTHING: press it with the panel open and read the log. The
; mod names the key it saw, with its id, and tells you what to put here. Two
; things are worth knowing before you go hunting:
;
;   One physical key can report several event names, and which one arrives
;   depends on what the game is doing. C presses as "ExitShip" and releases as
;   "StarbornPower". List every name your key reports; any of them will fire.
;
;   While piloting, some keys report no event name at all. C is one of those in
;   cruise, so no name can ever match it there, but "#67" can. On a KEYBOARD an
;   id is the virtual-key code: 67 is C, 84 is T, 9 is Tab, 13 is Enter. On a
;   CONTROLLER it is the pad's own code instead: D-pad up 1, down 2, left 4,
;   right 8, left stick click 64, RB 512, A 4096, X 16384, Y 32768, and the two
;   triggers at 9 and 10. Nothing checks which device an id came from, so an id
;   matches anything reporting that number - one more reason to prefer a name.
;
; An "#id" entry deliberately matches only a press the game has no name for. So
; "#67" means "the C key, where nothing is bound to it", and if you later bind
; a ship action to C the mod stands aside rather than firing on the same
; keystroke your ship is acting on. That is also the catch, and why an id is
; not the default: bind something to C and you lose the confirm key with
; nothing on screen to say why. Prefer a name wherever the game gives you one.
;
; Also confirmed to reach the mod in cruise: Quickkey2, Quickkey3 (keys 2 and
; 3). Three to avoid: "SelectTarget" still cycles targets in cruise, so it
; would do both jobs at once; "XButton" (R) opens the planet map once a target
; is selected, which is exactly the state the panel puts you in; "LShoulder" is
; not the POV toggle despite sharing a key with it on some bindings.
sConfirmEvent=TogglePOV

; The keys that move the highlight up and down the list. Same list rules as
; sConfirmEvent above: names, "#<id>", any entry fires.
;
; The defaults cover both devices at once, because a user event is not tied to
; one: the game resolves it against whatever you are holding. "ZoomIn"/"ZoomOut"
; are your mouse wheel; "Up"/"Down" are the D-pad. So the wheel browses on
; keyboard and mouse, the D-pad browses on a controller, and neither needs a
; setting changed.
;
; ON A CONTROLLER the D-pad is normally your ship's power allocation - but the
; game switches that off for the whole of cruise, which is the only time this
; panel exists. So browsing costs you nothing: power allocation is already
; unavailable while cruising, and the mod never touches it outside cruise or
; while the panel is closed.
;
; One press is one step. Holding a direction does not scroll.
sBrowseUpEvent=ZoomIn,Up
sBrowseDownEvent=ZoomOut,Down


; ---------------------------------------------------------------------------
; WHAT GOES IN THE LIST
; ---------------------------------------------------------------------------

; List every PLANET in the system, not only the ones your HUD is tracking.
; Untracked bodies show a dash instead of a distance and the marker cannot aim
; at them yet. You can lock a dash row anyway to set a destination early: it
; shows "..." while it waits and starts guiding you the moment it comes into
; range, with no need to lock it again.
;
; MOONS appear only once the HUD is actually tracking them, because a dash-row
; moon could not be pointed at and only fills in right beside its parent. A
; locked moon that leaves tracking range clears its own lock after a few
; seconds, so flying away never leaves a stale lock behind. Loading a save
; cannot clear a lock this way.
bListWholeSystem=true

; Show moons indented under the planet they orbit, and by how much. Which moon
; belongs to which planet is read from your own load order at startup, so
; Shattered Space and mod-added systems are included automatically. Nothing is
; written to disk and there is nothing to set up.
bNestMoons=true
fPanelMoonIndent=16.0

; Stations and landing sites, listed below the planets so the bodies stay
; together at the top. Ships are off by default: nearby traffic makes it a list
; of everything flying past rather than of places to go.
bIncludePOI=true
bIncludeShips=false

; Only offer bodies within this many light-seconds. Some star entries the game
; reports sit in other systems entirely, so this keeps the list to things you
; can actually fly to. 80000 LS spans the widest systems comfortably.
fMaxTargetLightSeconds=80000.0

; What an unrevealed station or point of interest is called. The game shows a
; generic name on its markers until you discover them, so the panel masks them
; the same way, following the same reveal state the HUD marker reads. The
; generic word comes from the game's own text in whatever language you play in,
; and these two are only the fallback if a word fails to translate.
;
; Prefer your own words? Set bUseCustomUndiscoveredLabels=true and these two
; are used for everything masked.
sUndiscoveredStationLabel=Starstation
sUndiscoveredPoiLabel=Unknown
bUseCustomUndiscoveredLabels=false


; ---------------------------------------------------------------------------
; SURVEY MARKS
; ---------------------------------------------------------------------------
; A body's survey progress, shown in the distance cell the way the vanilla
; planet card shows it:
;
;   part surveyed    a slim grey bar along the bottom of the cell
;   fully surveyed   the SURVEYED banner, with the distance number flipped to
;                    the banner's own dark colour
;
; Nothing is drawn for a body the mod has not read yet, so a late reading only
; ever reads as late, never as wrong.
bPanelSurveyMarks=true

; The banner colours, taken from the vanilla card: a near-white plate under
; four diagonal bands drawn gold, orange, crimson, navy in that order, so navy
; ends up on top and widest. The label colour is the distance number sitting on
; the banner. Swap any of them freely.
uPanelSurveyPlate=0xEBECEC
uPanelSurveyBand1=0xE0B460
uPanelSurveyBand2=0xEA7A49
uPanelSurveyBand3=0xC7233B
uPanelSurveyBand4=0x2D4E7B
uPanelSurveyLabel=0x152C4E
fPanelSurveyPlateAlpha=1.0

; How much of the distance cell the banner covers, anchored left. 1.0 is the
; vanilla look, with the plate under the whole cell and the dark number on top.
; Around 0.5 puts the bands on the left with the number beside them instead.
fPanelSurveyBannerWidth=1.0

; Whether a surveyed row's distance number takes the banner's dark colour. Turn
; this off if you shrink the banner clear of the number.
bPanelSurveyBannerText=true

; The progress bar, in the star map meter's own colours.
uPanelSurveyBarFill=0xC5C5C5
uPanelSurveyBarTrack=0x4E4E4E
fPanelSurveyBarHeight=3.0
fPanelSurveyBarAlpha=0.85
fPanelSurveyBarTrackAlpha=0.55

; Below this fraction, draw nothing at all. A track on every untouched body in
; the system is noise, and zero is much the commonest case.
fPanelSurveyMinPercent=0.01

; How often the listed bodies are re-read, in seconds, while the panel is OPEN.
; Nothing is read while it is closed, since nothing would show it. Ten bodies
; cost well under a millisecond, so this is comfort rather than necessity, and
; a body already reading 100% is never re-read. Opening the panel always reads
; immediately whatever this says.
fSurveySweepSeconds=5.0

; Reading a body's survey state means asking the game's script system about it,
; and that needs a script object attached to the body, so where none exists the
; mod attaches one. It is the only thing this mod writes anywhere, it is a few
; bytes of runtime bookkeeping, it never reaches your save file, and the game
; does the same thing itself whenever one of its own survey missions checks
; your progress.
;
; Turn it off and most rows simply never get a mark, though a body the GAME has
; already attached one to, typically one you have actually surveyed, still
; reads normally. The log says so once if you do.
bPanelSurveyBind=true


; ---------------------------------------------------------------------------
; HOW IT LOOKS
; ---------------------------------------------------------------------------

; The title strip across the top, in the loot panel's own teal. Emptying the
; title hides the strip, as does the flag.
;
; A title starting with "$" is a game text token, so it shows in whatever
; language you play in. Segments split on "|": each "$" segment is translated
; and everything else is literal, so the default reads "Cruise - Available
; Targets" in English and "Croisiere - Cibles disponibles" in French. Plain
; text works too. If a token fails to translate the panel falls back to English
; rather than showing you the bare token.
bPanelHeader=true
sPanelTitle=$CRUISE| - |$Outpost_AvailableTargets
uPanelHeaderColor=0x218286
fPanelHeaderAlpha=1.0
uPanelTitleColor=0x76C0C4

; Row text wears the colour of the game's own button labels, and the
; highlighted row brightens while the bar is on it. The bar itself defaults to
; the vanilla selection colour. If the pale bar reads poorly against the grey
; text on your display, the mod's older pair was cyan 0x66CCFF at 0.28 alpha.
uPanelTextColor=0xB7B7B7
uPanelHighlightColor=0xEFF3DC
fPanelHighlightAlpha=0.40
uPanelTextColorHighlight=0xFFFFFF

; A hairline between rows.
bPanelRowSeparators=true

; The cockpit tilt: the same slight 3D lean the game gives its loot panel,
; mirrored because this panel sits left of centre, so it turns toward the
; middle of the screen. Degrees. 0/0 is flat on, and the flag removes the 3D
; transform entirely.
bPanelTilt=true
fPanelTiltPitch=-5.0
fPanelTiltYaw=-5.0

; The open and close animation: the plate fades in while growing from its
; centre, and the list appears once it settles. Seconds each way, best tuned by
; ear against the sound. 0 turns it off and the panel snaps open.
fPanelAnimSeconds=0.30

; The panel's open and close sounds, the ship scanner's own pair, so the panel
; sounds like the key that summons it. Any sound editor id from the game works
; (UIMenuGeneralOK / UIMenuGeneralCancel and UIMenuShipMenuOpen /
; UIMenuShipMenuClose also fit). An empty value silences that side.
bPanelSounds=true
sPanelOpenSound=UICockpitHUDMonocleOpen
sPanelCloseSound=UICockpitHUDMonocleClose

; Small symbols in the left column, for the exceptions only: a ringed disc
; beside gas and ice giants, and a settlement badge beside the worlds carrying
; a major settlement. A glyph on every row turned out to be clutter, since the
; names already say which body is which.
bPanelIcons=true

; Prefer the game's OWN map icons in that column. Stations, ships and points of
; interest then show the same badge their map marker uses, specific art once
; discovered and the generic kind badge before that, and giants wear the in-view
; marker's own circle with a ring line across it. Drawn glyphs remain as the
; automatic fallback if a game icon cannot be built.
;
; The first scale fits the large map badges to the row, the second fits the
; smaller marker circle. Raise either a touch if they read small at your
; resolution.
bPanelVanillaIcons=true
fPanelVanillaIconScale=0.28
fPanelGiantIconScale=0.85

; The control hints along the bottom of the panel. Both are the game's own
; hotkey pills, so each shows your real binding and follows a rebind by itself.
; Labels take game text tokens or plain text.
;
; A pill anchors with its label extending left and the key cap right: the
; browse knob is measured from the panel's left edge, the confirm knob is a pad
; in from the right edge.
bPanelHints=true
sPanelBrowseLabel=$CycleTarget
sPanelConfirmLabel=$ShipHUD_SelectTarget
fPanelHintPillScale=0.8
fPanelBrowsePillX=100.0
fPanelConfirmPillRightPad=40.0

; Which binding the BROWSE pill puts on its cap, per device. A pill can only
; draw a key it can resolve for the device in your hands, so this needs one
; entry per device where the confirm pill needs none: the mouse wheel has no
; controller binding and the D-pad has no keyboard one. The mod asks the game
; which device you are using and swaps the cap when you swap device, including
; while the panel is open.
;
; The controller entry is a list, and the pill draws the pair as one cap - the
; same way the game's own two-way hints do.
;
; The wheel cap can only render the binding's NAME ("MOUSEWHEELUP"): the button
; component has no artwork for a wheel. That is why it looks plainer than the
; others. If the pill cannot be built at all, a drawn wheel symbol takes over.
sPanelBrowsePillEvent=ZoomIn
sPanelBrowsePillEventPad=Up,Down

; Fallback only: this label is used just when the confirm pill cannot be built,
; or when sConfirmEvent holds nothing but "#id" entries, since a raw key number
; has no binding for the pill to resolve. With a working pill you never see it.
sConfirmKeyLabel=Q

; A hint pill on the cruise HUD while the panel is closed, built from the same
; button component the game's own cruise hints use, so it shows YOUR scanner
; binding and follows rebinds and controller swaps by itself. $SCAN is the
; scanner's own word in every language. Position is from screen centre, and the
; default sits just above the game's EXIT CRUISE hint.
bScannerHint=true
sScannerHintLabel=$SCAN
fScannerHintOffsetX=0.0
fScannerHintOffsetY=440.0
fScannerHintScale=1.0


; ---------------------------------------------------------------------------
; THE HUD: BLIPS AND THE MARKER
; ---------------------------------------------------------------------------

; The blips are the circle-and-arrow markers around the reticle ring that point
; at things outside your view. They hide only while the mod has a stake in
; them: with the panel OPEN everything hides except your highlight and your
; locked target, and with a target LOCKED and the panel closed everything hides
; except that target. Clear the lock, close the panel, and the HUD is exactly
; vanilla again. Plain cruising is untouched.
;
; Markers on things you can actually see are a different kind and are never
; touched, and neither is the indicator on whatever you have targeted with the
; target key. All of this is display only and resets with the HUD.
bHideVanillaBlips=true

; Keep blips carrying a quest marker even while hiding the rest, so active
; missions stay pointed at. Only meaningful with bHideVanillaBlips on.
bKeepQuestBlips=true

; Let the highlighted and locked bodies' own blips back through. With this off,
; every vanilla blip stays hidden in cruise and the mod's own marker does all
; the pointing.
bShowLockedBlip=true

; The mod's own marker, for bodies the game is showing nothing for. It carries
; no name text, since the game's blips carry none and the panel row already
; shows the name and distance. The mod also stands down whenever the game marks
; your body on screen itself.
bArrow=true

; With this on, that marker is a real HUD blip the mod drives rather than a
; drawn diamond, so it wears planet, star, station and outpost art like any
; other. The diamond quietly returns if the game's blip cannot be borrowed.
bVanillaStyleMarker=true

; Distance of the marker from the crosshair, in HUD units. Larger pushes it
; further out toward the edge of the view.
fArrowRadius=150.0

; Your panel target wins the fight for screen space. The game hides overlapping
; markers by priority, so a planet sliding into view can hide a targeted
; station's marker, and a near station can sit on top of a targeted planet.
; With this on, whatever marker is crowding your target fades out instead, and
; the game then shows your target's own marker, name and all. The faded marker
; returns the moment you clear the target, pick another, or steer them apart.
;
; Quest markers and the marker of whatever you have targeted with the target
; key keep their priority, and when one of those is what covers your panel
; target the mod draws nothing extra.
bSelectionWinsOverlap=true

; Rotation correction in degrees, and bearing inversion. Both should be
; unnecessary and are here in case the marker points wrongly on a setup that
; differs from the one this was built against. Try 90, 180 or 270 if it is off
; by a constant, or the invert switch if it mirrors your turns.
fArrowAngleOffset=0.0
bArrowInvertAngle=false


; ---------------------------------------------------------------------------
; SWITCHES FOR CHASING A CONFLICT
; ---------------------------------------------------------------------------

; The panel itself. Off, the mod does nothing at all in cruise.
bPanel=true

; The mod's connection to the game's input chain. The scanner key reaches the
; mod through this, so with it off nothing is ever selected and no marker
; appears. It is here only so you can rule the mod's one engine hook out while
; chasing a conflict, without having to unload the plugin.
bInputTap=true

; Hide the mouse wheel, and the confirm key, from the camera while the panel is
; open, so browsing the list does not swing your point of view. Turn this off
; only if the camera misbehaves; with it off, scrolling changes your view as
; usual and a camera-bound confirm key moves it too.
bWheelFilter=true


[Scaleform]

; The mod's subscription to the ship HUD's target data. This is how it knows
; what is in the system and where each body lies. There is no reason to turn
; this off except to disable the mod entirely.
bInterposeTargetData=true

; Only subscribe once you are actually flying - not merely sitting in the pilot
; seat of a landed or docked ship. Taking off rebuilds the HUD from scratch, so a
; subscription made on the pad is discarded seconds later without ever having
; been read; skipping it saves the work and keeps the mod out of the busiest part
; of the takeoff.
;
; Turn this off if the mod stops finding the feeds. The log says which state it
; is in ("[nav] flight gate: ..."), and this switch removes the check without
; affecting the movie-settle protection underneath it.
bGateOnFlightState=true

; Diagnostics, all off. Very verbose, and only useful for a bug report.
bLogTargetCaptures=false
bScaleformReader=false
bScaleformSkipBoilerplate=true
uScaleformDepth=8
uScaleformMaxLines=6000
uScaleformMaxChildren=60


[Recon]

; ---------------------------------------------------------------------------
; THE ONE THAT MAKES A BUG REPORT USEFUL - ON BY DEFAULT SINCE 1.1.2
; ---------------------------------------------------------------------------
; On, the log carries the running trace of what the mod is doing: a line per
; wheel notch and per blip taken or given back, which is what turns a vague
; "the marker went to the wrong place" into something fixable. Off, you get the
; startup, your settings, anything that changed once, and every warning - still
; a page or two you can attach whole, but rarely enough to diagnose from.
;
; It defaults on because a report filed without it usually has to be filed
; twice. Still far quieter than the switches below: ordinary play writes tens of
; lines a session, not thousands. Turn it off if you want a near-silent log.
bVerboseLog=true

; ---------------------------------------------------------------------------
; Instrumentation from building the mod. All off, and all extremely verbose:
; with input logging on, ordinary play writes thousands of lines a session.
; ---------------------------------------------------------------------------
bLogInput=false
bLogInputHeldFrames=false
bLogInputNonButton=false
uMaxInputLines=20000
bLogMenus=false
bLogHeartbeat=false
fHeartbeatSeconds=5.0
bVerifyVTableID=false

; Survey which keys reach the mod while cruising, to find ones the game ignores
; that the panel could borrow. Enter cruise and press every key you can spare:
; each new one prints a single line, and leaving cruise prints a recap. Much
; quieter than bLogInput.
bSurveyCruiseKeys=false

; Dump each planet's raw record data to the log, for investigating where the
; game keeps the moon hierarchy. Press the scanner key once in cruise with this
; on; it writes a few hundred lines.
bDumpPlanetRecords=false
uDumpPlanetBytes=1024

; Subscribe to a named data feed and log what it holds. InfoTargetProvider is
; the interesting one: it carries the body dossier the vanilla planet card
; draws, survey percentage included, and with it on the scanner key dumps that
; dossier in full beside the matching feed entry.
bProbeStarmapFeed=false
sStarmapFeed=StarmapSystemBodyInfoProvider

; Ask the game's script system for a body's survey percentage and report every
; step of the chain, which is how the survey marks were built. Press the scanner
; key once in cruise with this on and read the "[surveyed]" lines. Read only.
; The cap is how many bodies one press asks about, and the bind switch is the
; probe's own copy of bPanelSurveyBind.
bProbeSurveyVM=false
uProbeSurveyMaxBodies=1
bProbeSurveyBind=true

; A throttle-suppression test that does not work. The game acts on the throttle
; regardless, and it is kept only so the negative result stays reproducible.
bSuppressThrottleTest=false

; A one-off drawing check: two coloured squares near the crosshair with a clear
; between them. Harmless, but it draws over the middle of your screen.
bTestGraphicsClear=false

; A second panel, built from the game's own loot panel component, shown beside
; the drawn one. It was the audition that chose the current look, and it stays
; available for comparing borrowed parts against live vanilla art. Position is
; from screen centre. The tint recolours its teal header strip; 0 keeps the
; authentic colour.
bProbeVanillaChrome=false
fProbeChromeOffsetX=220.0
fProbeChromeOffsetY=-160.0
uProbeHeaderTint=0

; ShipNavPanel - Phase 0 recon build.
; This build never changes anything in game; it only writes observations to
; Documents\My Games\Starfield\SFSE\Logs\ShipNavPanel.log
;
; Override any of these in ShipNavPanelCustom.ini instead of editing this file.

[Recon]

; Tap the game's input chain and log button events (this is the question the
; whole mod hinges on: does the scanner key still arrive during cruise?).
bLogInput=true

; Log every frame a button stays held. Off by default - one held key otherwise
; produces thousands of lines a minute. Presses and releases are always logged.
bLogInputHeldFrames=false

; Log non-button input too (mouse move, thumbstick, cursor). Very noisy; only
; useful if a control turns out not to be a button event at all.
bLogInputNonButton=false

; Stop input logging after this many lines, so a stuck key can't fill the disk.
; 0 = no limit.
uMaxInputLines=20000

; Log menus opening and closing, and every menu whose Scaleform movie loads.
; This is how the exact ship HUD menu name gets confirmed.
bLogMenus=true

; Periodically log ship and location state, for correlating with the input log.
bLogHeartbeat=true
fHeartbeatSeconds=5.0

; One-off check: compare the Address Library's UI vtable id against the vtable
; actually found on the live UI object. Only useful when preparing Phase 1
; hooks; leave off for normal recon runs.
bVerifyVTableID=false

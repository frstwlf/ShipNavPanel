; ShipNavPanel - Phase 0 recon build.
; This build never changes anything in game; it only writes observations to
; Documents\My Games\Starfield\SFSE\Logs\ShipNavPanel.log
;
; Override any of these in ShipNavPanelCustom.ini instead of editing this file.

[Recon]

; Tap the game's input chain and log button events (this is the question the
; whole mod hinges on: does the scanner key still arrive during cruise?).
bLogInput=true

; Log every frame a button stays held. Off by default - one held key otherwise
; produces thousands of lines a minute. Presses and releases are always logged.
bLogInputHeldFrames=false

; Log non-button input too (mouse move, thumbstick, cursor). Very noisy; only
; useful if a control turns out not to be a button event at all.
bLogInputNonButton=false

; Stop input logging after this many lines, so a stuck key can't fill the disk.
; 0 = no limit.
uMaxInputLines=20000

; Log menus opening and closing, and every menu whose Scaleform movie loads.
; This is how the exact ship HUD menu name gets confirmed.
bLogMenus=true

; Periodically log ship and location state, for correlating with the input log.
bLogHeartbeat=true
fHeartbeatSeconds=5.0

; One-off check: compare the Address Library's UI vtable id against the vtable
; actually found on the live UI object. Only useful when preparing Phase 1
; hooks; leave off for normal recon runs.
bVerifyVTableID=false


[Scaleform]

; ---------------------------------------------------------------------------
; Interpose on the ship HUD's target-data entry point.
;
; The target list is a PRIVATE member of ShipReticle, so it cannot be read from
; outside - and uniqueID, which the panel's confirm action needs, is only ever
; the key of a private array, so it is not on the icon clips either. The engine
; delivers the data through a PUBLIC function though, so this replaces that
; function with a native one, reads the argument on the way past, and calls the
; original. The HUD behaves exactly as before.
;
; Press the scanner key (SHMonocle) while the ship HUD is up to capture one
; frame's worth. Nothing is read on any other frame.
;
; Turn this off if the HUD's target display ever misbehaves - the interposition
; is undone by a restart in any case, since it is applied to the live movie and
; nothing is written to disk.
bInterposeTargetData=true

; Walk the whole ActionScript object tree on the same key. This did its job
; (it found the reticle, cruise state, and the target icons) and now mostly
; produces thousands of lines of noise, so it is off by default. Turn it on to
; explore a part of the menu the interposer does not cover.
bScaleformReader=false

; Log the full target list and bearings on each scanner-key press. Useful while
; diagnosing, noisy otherwise.
bLogTargetCaptures=false


[Panel]

; Draw an arrow that points at the selected body, live while the ship steers.
; Press the scanner key (SHMonocle) to cycle through the system's bodies.
;
; The arrow is driven by the same field the game's own off-screen blips use
; (angleToCrosshair, a screen bearing), so it stays correct for targets behind
; the ship - where screen positions are unusable.
bArrow=true

; Distance of the arrow's tip from the crosshair, in HUD units.
fArrowRadius=150.0

; Rotation correction, in degrees, added after the bearing.
; The game's own off-screen blips use angle+180 because their art points the
; other way by default; this triangle is drawn tip-up, so a body dead ahead
; (bearing 0) should want 0. If the arrow is consistently wrong by a fixed
; amount, put that amount here - 90, 180 and 270 are the likely values.
fArrowAngleOffset=0.0

; Negate the bearing before applying the offset. Set this if the arrow mirrors
; your turns instead of following them - i.e. it swings left as you turn right.
bArrowInvertAngle=false

; Show the body's name and distance beside the arrow.
;
; Tested safe in both states as of v0.1.5, so this is on by default again. The
; v0.1.3 crash was a threading bug, not the text field: Scaleform work was being
; done from the wrong thread. Creating the field itself turned out to be fine.
;
; The field does need a font, though. One created at runtime has none, and every
; glyph renders as a solid box - so the format is borrowed from a TextField the
; HUD already owns, which guarantees a font that exists in this movie.
bLabel=true

; Only offer bodies within this many light-seconds. A star entry is not
; necessarily this system's star - a quest-marked one showed up at ~87 light
; years - so type alone is not a safe filter.
fMaxTargetLightSeconds=20000.0

; Skip the ~40 standard ActionScript display properties every clip carries
; (alpha, blendMode, scaleX, filters...) and the members that loop back up the
; tree (loaderInfo, parent, root, stage). With these included, a walk spends its
; entire budget on boilerplate and cycles before reaching any game data - which
; is exactly what happened on the first run. Turn off only to inspect a clip's
; raw display properties.
bScaleformSkipBoilerplate=true

; How many levels of the object tree to walk. With boilerplate skipped the tree
; is narrow, so this can afford to be deep.
uScaleformDepth=8

; Safety caps: total lines per dump, and children visited per object/array.
; Raise uScaleformMaxChildren if the target list looks truncated.
uScaleformMaxLines=6000
uScaleformMaxChildren=60

; ShipNavPanel - beta
;
; In cruise mode, the ship scanner key opens a panel listing every body in the
; current system - planets, moons, stations, points of interest - with the
; game's own map icons. The mouse wheel moves the highlight, the confirm key
; locks a body, and the game's own HUD marker points at it, live as you steer.
; Outside cruise the mod is idle and the scanner key keeps its normal job.
;
; Override anything here in ShipNavPanelCustom.ini rather than editing this file
; - your changes then survive an update.

[Panel]

; Tap the game's input chain. The scanner key reaches the mod through this, so
; with it off nothing is ever selected and no marker appears - it is here
; only so you can rule the mod's one engine write out while chasing a conflict,
; without unloading the plugin.
bInputTap=true

; The list panel. In cruise, the ship scanner key opens and closes it, the mouse
; wheel moves the highlight, and the confirm key below locks the highlighted
; body onto the HUD - or clears it, if it is already the locked one. Close the
; panel without confirming and nothing changes, which is how you clear a target
; without having to pick a different one.
bPanel=true

; The key that locks or clears. A comma-separated list; any entry fires it.
; An entry is either a user-event NAME, which follows your bindings, or "#<id>",
; a raw key code for a key the game has no name for.
;
; The default is your POV toggle. It is a name, so it goes wherever you have
; bound that action, and while the panel is open the mod hides it from the
; camera (same mechanism as the mouse wheel - see bWheelFilter), so it locks a
; body without also swinging your view. That is what makes a POV key a good
; choice: if the hiding ever fails, the cost is a swung camera and nothing else.
;
; If a key does nothing, press it with the panel open and read the log. The mod
; names the key it saw, with its id, and tells you exactly what to put here.
; Two reasons a key may need more than one entry:
;
;   ONE PHYSICAL KEY CARRIES SEVERAL USER EVENTS, and which name is reported
;   depends on what the game is doing - a press on C arrives as "ExitShip"
;   while its own release arrives as "StarbornPower". List every name your key
;   reports and any of them will fire it.
;
;   WHILE PILOTING, A KEY MAY REPORT NO USER EVENT AT ALL. C is one of those:
;   in cruise it is nameless, so no name can ever match it there. "#67" can.
;   Ids are virtual-key codes: 67 is C, 84 is T, 9 is Tab, 13 is Enter.
;
; An "#id" entry deliberately matches ONLY a press the game has no name for.
; "#67" means "the C key, where nothing is bound to it", not "the C key come
; what may" - an id is a physical key and cannot follow a rebind, so if you bind
; a ship action to C the game names that press and the mod stands aside rather
; than firing on the same keystroke your ship is acting on.
;
; That is also the catch, and why an id is not the default: if you bind anything
; to C, you lose the confirm key entirely and nothing on screen says why. A name
; cannot fail that way. Prefer a name wherever the game gives you one, and reach
; for an id only for a key the game leaves nameless.
;
; Alternatives confirmed to reach the mod in cruise: Quickkey2, Quickkey3
; (keys 2 and 3).
;
; Three that are NOT suitable, all found the hard way:
;   "SelectTarget" - the ship target key - still cycles targets in cruise, so it
;   would do both jobs at once.
;   "XButton" (R) was the default up to v0.7.0. It does nothing while merely
;   flying, which is how it passed testing, but it opens the planet map once a
;   target is selected - and putting you in that state is the whole point of the
;   panel. Test a candidate with a target locked, not just in an empty sky.
;   "LShoulder" is NOT the POV toggle, despite sharing a key with it on some
;   bindings. Setting it does nothing. The POV toggle is "TogglePOV".
sConfirmEvent=TogglePOV

; The control hints along the bottom are both real hotkey pills - the same
; component as the HUD hints. The wheel pill's cap can only show the
; binding NAME ("MOUSEWHEELUP" - the game has no wheel art for it), and it
; is kept anyway as the honest display of whatever POV cycling is bound
; to; the drawn grey glyph returns automatically if the pill cannot be
; built. The confirm pill resolves the first named entry of sConfirmEvent
; and follows rebinds by itself. Labels take tokens or plain text.
;
; A pill anchors on its position with the label extending left and the key
; cap right: the browse knob is its anchor from the panel's LEFT edge, the
; confirm knob a pad from the RIGHT edge to the anchor (40 lands the cap
; at the plate's edge).
bPanelHints=true
sPanelBrowseLabel=$CycleTarget
sPanelConfirmLabel=$ShipHUD_SelectTarget
fPanelHintPillScale=0.8
fPanelBrowsePillX=100.0
fPanelConfirmPillRightPad=40.0

; Every text in the panel wears the pills' own label colour - measured off
; the game's button art (0xB7B7B7, decimal 12040119) - except the header,
; which keeps its cyan. The wheel glyph wears it too.
uPanelTextColor=12040119

; The highlight bar, defaulting to the game's own selection colour: the
; loot rows' selected state is flat 0xEFF3DC (decimal 15725532) at ~40%,
; measured off the game's art. The panel's old invented pair was cyan
; 0x66CCFF (6737151) at 0.28 - put those back if the pale bar reads worse
; against the grey text. The highlighted row's own text steps up to the
; brighter colour below while the bar is on it, vanilla's own trick.
uPanelHighlightColor=15725532
fPanelHighlightAlpha=0.40
uPanelTextColorHighlight=16777215

; FALLBACK ONLY since the pill above: this label is used just when the pill
; cannot be built or sConfirmEvent contains only "#id" entries (a raw key
; number has no binding for the pill to resolve). With a working pill the
; mod never shows this text.
sConfirmKeyLabel=Q

; Sounds when the panel opens and closes - the ship scanner's own pair, so
; the panel sounds like the key that summons it. Any sound-descriptor
; editor id from the game works here (a few that fit: UIMenuGeneralOK /
; UIMenuGeneralCancel, UIMenuShipMenuOpen / UIMenuShipMenuClose); an empty
; value silences that side, the flag silences both.
bPanelSounds=true
sPanelOpenSound=UICockpitHUDMonocleOpen
sPanelCloseSound=UICockpitHUDMonocleClose

; A hint pill on the cruise HUD while the panel is closed, built from the
; game's own button component - the same family as the "Cruise" hotkey
; hint - so it shows YOUR actual scanner binding and follows rebinds and
; keyboard/controller swaps by itself. The label takes a localisation
; token or plain text. $SCAN is the scanner's own word in every language;
; other good fits found in the game's tables: $CycleTarget ("CYCLE
; TARGET" / "CHANGER CIBLE"), $SELECT TARGET, $TARGET LOCK - and the same
; tokens work for sPanelTitle above. Position is from screen centre,
; below the reticle by default.
bScannerHint=true
sScannerHintLabel=$SCAN
fScannerHintOffsetX=0.0
fScannerHintOffsetY=440.0
fScannerHintScale=1.0

; The open/close animation: the plate fades in from nothing WHILE growing
; to full size about its centre, and the list appears once it settles;
; closing shrinks and fades it out together. This many seconds each way -
; tune it by ear against the sound. 0 turns it off and the panel snaps
; open as it used to.
fPanelAnimSeconds=0.30

; The title strip across the top, built like the hint bar: title text with a
; hairline under it. Emptying the title hides the strip, as does the flag.
; The panel's background is the ship HUD loot panel's own plate colour
; (black at half alpha), so the two read as kin.
;
; A title starting with "$" is a localisation token, resolved through the
; game's own translation so it shows in whatever language you play in. The
; default is the exact word the HUD's own cruise hint uses. Plain text works
; too ("sPanelTitle=Navigation targets"), and other HUD tokens are fair
; game - "$CruiseCourseLock" for instance. If a token fails to translate,
; the panel falls back to English words rather than showing the bare token.
; Segments split on "|": each "$" segment is translated, everything else is
; literal text - the default renders as e.g. "Croisiere - Cibles
; disponibles" in French, "Cruise - Available Targets" in English.
;
; The strip is SOLID in the vanilla loot panel's own teal, with the title
; in its light-teal - both measured off the game's art (0x218286 = 2196102
; and 0x76C0C4 = 7782596).
bPanelHeader=true
sPanelTitle=$CRUISE| - |$Outpost_AvailableTargets
uPanelHeaderColor=2196102
fPanelHeaderAlpha=1.0
uPanelTitleColor=7782596

; The cockpit tilt: the same 3D lean the game gives its loot panel (about
; five degrees of pitch tipping the top away and five of yaw), with the
; yaw mirrored because this panel sits LEFT of centre - it turns toward
; the middle of the screen the way the loot panel does from the right.
; Angles in degrees; positive yaw turns the other way, 0/0 is flat-on,
; and the flag removes the 3D transform entirely.
bPanelTilt=true
fPanelTiltPitch=-5.0
fPanelTiltYaw=-5.0

; Stations and landing sites in the list, listed below the planets so the bodies
; stay together at the top. Ships are off by default - near traffic that would
; be a list of everything flying past rather than of places to go.
bIncludePOI=true
bIncludeShips=false

; What an UNDISCOVERED station or point of interest is called in the list.
; The game shows a generic name on their markers until you discover them
; ("Starstation", "Asteroids", ...), but the data behind the HUD carries the
; real name early - so the panel masks it the same way the game's own
; markers do. The generic word comes from the game's own localisation, per
; marker kind, in whatever language you play in - available immediately,
; nothing needs to be on screen first. The two words below are only the
; fallback for the rare kind the game has no word for.
;
; Prefer your own words instead? Set bUseCustomUndiscoveredLabels=true and
; the two below are used for everything undiscovered, the game's words
; ignored.
sUndiscoveredStationLabel=Starstation
sUndiscoveredPoiLabel=Unknown
bUseCustomUndiscoveredLabels=false

; A hairline between rows.
bPanelRowSeparators=true

; Small symbols in the left column, for the exceptions only: a ringed disc
; beside gas and ice giants (the bodies you cannot land on), and a skyline
; beside the seventeen worlds carrying a major settlement. Only those - a glyph
; on every row turned out to be clutter, since the names already say which body
; is which.
bPanelIcons=true

; The column prefers the game's OWN map icons where they exist (v0.11.0):
; stations, ships and points of interest show the same badge their map
; marker uses - the specific art once discovered, the generic kind badge
; before that, exactly as the game masks them - and the settled worlds show
; the game's surface-settlement badge instead of the drawn skyline. The
; gas and ice giants wear the in-view marker's own circle with a ring line
; across it (v0.11.1) - one icon for every giant kind. Every drawn glyph
; remains as the automatic fallback if a game icon cannot be built.
;
; The first scale fits the 70 px badges to the row; the second fits the
; ~15 px marker circle - raise either a touch if they read too small at
; your resolution.
bPanelVanillaIcons=true
fPanelVanillaIconScale=0.28
fPanelGiantIconScale=0.85

; Show moons indented under the planet they orbit, and by how much. Moons are
; grouped under their planet whatever order the game lists them in, read from
; each body's own record rather than guessed.
bNestMoons=true
fPanelMoonIndent=16.0

; List every PLANET in the system, not only the ones the ship's HUD is
; currently tracking. Bodies the game is not tracking have a dash instead of a
; distance and the pointer cannot aim at them; fly closer and they fill in.
; You can lock a dash-row planet anyway, to set a destination before the game
; will follow it: it shows "..." while it waits and starts guiding you by
; itself the moment it comes into range - no need to lock it again.
;
; MOONS appear only once the HUD is actually tracking them. A dash-row moon
; could not be pointed at and only fills in right next to its parent - by
; which point the game offers it anyway - so listing every moon from across
; the system was noise. A locked moon that leaves tracking range clears its
; own lock within a few seconds (its row shows "..." until then), so flying
; away from a moon never leaves a stale lock hiding your blips. Loading a
; save can never clear a lock this way: the mod insists on seeing the moon
; tracked once before its absence is allowed to mean anything.
bListWholeSystem=true

; Nesting needs no setup: the mod reads which planet each moon orbits out of
; your whole load order in the background each time the game starts - so
; planets added by Shattered Space or by other mods are always included, and
; nothing is written to disk. (Versions before 0.17.0 kept a
; ShipNavPanelBodies.txt cache beside this file; the mod now deletes that
; leftover if it finds one.)

; Hide the mouse wheel - and the confirm key - from the camera while the panel
; is open, so browsing the list does not swing your point of view. Turn this off
; only if the camera misbehaves; with it off, scrolling changes your view as
; usual and a camera-bound confirm key moves it too.
bWheelFilter=true

; Where the list sits, measured from the centre of the screen, and how big it
; is. Negative X is left of centre, negative Y is above it. The width matches
; the vanilla loot panel's since v0.12.0. Long names truncate with the game's
; own "…" once they reach the distance column, and a slim scrollbar appears
; down the left edge whenever the system has more bodies than the panel has
; rows.
fPanelOffsetX=-780.0
fPanelOffsetY=-180.0
fPanelWidth=425.0
fPanelRowHeight=26.0
uPanelMaxRows=10

; The pointer marker, for bodies the game is not showing a blip of its own
; for. It carries no name text: the game's blips carry none, and the panel
; row already shows the name and distance.
bArrow=true

; Distance of the arrow's tip from the crosshair, in HUD units. Larger pushes it
; further out towards the edge of the view.
fArrowRadius=150.0

; Only offer bodies within this many light-seconds. Some star entries the game
; reports are in *other* systems - a quest-marked one showed up ~87 light-years
; away - so this keeps the list to things you can actually fly to. 80000 LS
; (~2.7 light-days) spans the widest systems while still excluding
; other-system entries by orders of magnitude.
fMaxTargetLightSeconds=80000.0

; Rotation correction in degrees, and bearing inversion. Both should be
; unnecessary; they are here in case the arrow points wrongly on a setup that
; differs from the one this was built against. Try 90 / 180 / 270 if it is off
; by a constant, or the invert switch if it mirrors your turns.
fArrowAngleOffset=0.0
bArrowInvertAngle=false

; --- Vanilla blips (v0.8.0) ---

; The blips - the circle-and-arrow markers around the reticle ring that point
; at things outside your view - hide only while the mod has a stake: with the
; panel OPEN, everything hides except the body your highlight is on and your
; locked target; with a target LOCKED and the panel closed, everything hides
; except that target. Clear the lock and close the panel and the HUD is
; exactly vanilla again - plain cruising is untouched. The game's own marker
; does the pointing for the highlighted or locked body, with its real colours
; and states; the mod's own marker only appears for bodies the game is not
; blipping (the HUD blips a limited set: roughly the five nearest planets,
; plus quest targets - so a distant lock or a dash-row body keeps the mod's
; marker). Nothing on the HUD carries name text either way - names and
; distances live in the panel list.
;
; Markers on things you can see are a different kind and are never touched,
; and neither is the indicator on whatever you have actually targeted with the
; target key. Everything here is display-only and resets with the HUD; nothing
; is written into your save.
bHideVanillaBlips=true

; Keep blips that carry a quest marker even while hiding the rest, so active
; missions stay pointed at. Only meaningful with bHideVanillaBlips on.
bKeepQuestBlips=true

; Let the highlighted and locked bodies' own blips back through. With this
; off, every vanilla blip stays hidden in cruise and the mod's own marker
; does all the pointing.
bShowLockedBlip=true

; The mod also stands down whenever the body you have highlighted or locked
; is marked on screen by the game itself - the circle sitting where the body
; actually is, with its name. Between that and the blips above, the mod's own
; marker only ever appears for a body the game is showing nothing for.
;
; And when it does appear, this makes it wear the game's own art: the marker
; is a real HUD blip the mod drives itself, instead of the drawn diamond -
; planet, star, station and outpost art alike, using the same icon data the
; game's own blips draw from. If the game's blip cannot be borrowed for any
; reason the diamond quietly returns. Turn this off for the pre-v0.8.2 cyan
; diamond.
bVanillaStyleMarker=true

; Your panel target wins the fight for screen space. The game hides
; overlapping markers by priority - planets rank above anything more than a
; light-second away, and anything nearer than a planet ranks above it - so
; with a station targeted, a planet sliding into view makes the station's
; marker vanish (Earth over the Nova Galactic Staryard), and with a planet
; targeted, a near station sits on top of it (the Staryard over Earth). With
; this on, whatever marker is crowding your target fades out instead, and
; the game then shows your target's own marker - name and all - exactly as
; it does when you target it with the target key. The faded marker returns
; the moment you clear the target, pick another, or steer them apart.
;
; Markers are only faded while they overlap your target's marker. Quest
; markers and the marker of whatever you have E-targeted keep their
; priority - missions and your own targeting still outrank the panel - and
; when one of THOSE is what covers your panel target, the mod draws nothing
; extra: the game is deliberately showing that marker on top, and a second
; marker beside your E-target was clutter.
bSelectionWinsOverlap=true


[Scaleform]

; Subscribe to the ship HUD's target data feeds. This is how the mod knows what
; is in the system and where each body lies - the arrow does not work without
; it. There is no reason to turn this off except to disable the mod entirely.
bInterposeTargetData=true

; Diagnostics, all off. Turn these on only to gather detail for a bug report;
; they are verbose and some are extremely so.
bLogTargetCaptures=false
bScaleformReader=false
bScaleformSkipBoilerplate=true
uScaleformDepth=8
uScaleformMaxLines=6000
uScaleformMaxChildren=60


[Recon]

; Instrumentation from the investigation that built this mod. All off: with
; input logging on, ordinary play writes thousands of lines a session. Useful if
; something misbehaves and you want to show what the game was doing.
bLogInput=false
bLogInputHeldFrames=false
bLogInputNonButton=false
uMaxInputLines=20000
bLogMenus=false
bLogHeartbeat=false
fHeartbeatSeconds=5.0
bVerifyVTableID=false

; Survey which keys reach the mod while cruising, to find ones the game ignores
; and the panel could therefore borrow. Enter cruise and press every key you can
; spare: each new one prints a single line saying whether it arrived and whether
; it was already disabled, and leaving cruise prints a recap. Keys whose
; behaviour is already known are labelled as such - the ones marked UNKNOWN that
; visibly do nothing are the interesting ones. Far quieter than bLogInput.
bSurveyCruiseKeys=false

; Dump each planet's raw record data to the log, side by side, for working out
; where the game keeps the moon hierarchy. Press the scanner key once in cruise
; with this on; it writes a few hundred lines and is for investigation only.
bDumpPlanetRecords=false
uDumpPlanetBytes=1024

; Subscribe to the star map's own body feed and log what it holds. The
; subscription succeeds but the feed never fires with the map closed, so this
; answered its question and is kept only to make that repeatable.
bProbeStarmapFeed=false
sStarmapFeed=StarmapSystemBodyInfoProvider

; The throttle-suppression test from v0.2.1. It does not work - the game acts on
; the throttle regardless - and is kept only so the negative result stays
; reproducible. Leave it off.
bSuppressThrottleTest=false

; One-off check used while developing the body icons: draws two coloured squares
; near the crosshair with a "clear" between them, to find out whether drawn
; shapes can be wiped and replaced. Harmless, but it draws over the middle of
; your screen, so leave it off.
bTestGraphicsClear=false

; --- The chrome probe (v0.9.x) ---
;
; A second panel, made of the game's OWN loot-panel component, shown beside
; the drawn one to audition it as the panel's future look. It answered its
; questions - and the comparison chose the DRAWN panel, which now wears the
; loot panel's plate colour and a title strip instead. The probe stays
; available for future comparisons and for auditioning borrowed parts
; against live vanilla art; flip it on and it rides the panel open/close
; with four sample rows, the wheel mirrored into its highlight (each wheel
; move writes a [chrome] "mirror sel" diagnostic line while it is on).
bProbeVanillaChrome=false

; Where the probe sits, from screen centre - to the right of the reticle by
; default, roughly where the game itself puts this panel when looting.
fProbeChromeOffsetX=220.0
fProbeChromeOffsetY=-160.0

; The decoration pass on the same probe: the name column shifts right to open
; an icon column (skyline on Jemison, ring on Olivas - bare rows are correct,
; only the exceptions get a glyph) and a distance column appears at the right
; edge in the rows' own cloned text face. Rows keep the game's own height -
; v0.9.1 tried compacting them and the text sat visibly low, so vanilla
; density is the design now, not an option.
;
; While the wheel question is open, every wheel move writes one [chrome]
; "mirror sel" line to the log naming each hop - what the mod computed,
; whether the list accepted it, and which frame the row landed on. Wheel with
; the panel open, then read the log tail.

; Tint the teal header strip to an exact colour, using the same mechanism the
; game uses for the row highlight. 0 keeps the authentic teal (#218286).
; Give a colour as 0xRRGGBB if hex works in your ini reader, else decimal -
; e.g. 0x2F4F6E, decimal 3100526, for a steel blue.
uProbeHeaderTint=0
